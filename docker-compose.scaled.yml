services:
  api-gateway-scaled-a:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: api-gateway:latest
    env_file:
      - .env
    environment:
      BACKEND_BASE_URL: http://mock-backend:8081
      BACKEND_CONNECT_TIMEOUT_MS: ${BACKEND_CONNECT_TIMEOUT_MS:-500}
      BACKEND_READ_TIMEOUT_MS: ${BACKEND_READ_TIMEOUT_MS:-2000}
      BACKEND_MAX_ATTEMPTS: ${BACKEND_MAX_ATTEMPTS:-1}
      BACKEND_RETRY_BACKOFF_MS: ${BACKEND_RETRY_BACKOFF_MS:-50}
      BACKEND_CIRCUIT_BREAKER_ENABLED: ${BACKEND_CIRCUIT_BREAKER_ENABLED:-true}
      BACKEND_CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${BACKEND_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      BACKEND_CIRCUIT_BREAKER_RESET_TIMEOUT_MS: ${BACKEND_CIRCUIT_BREAKER_RESET_TIMEOUT_MS:-5000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT_STRATEGY: ${SCALED_RATE_LIMIT_STRATEGY:-redis-sliding-window}
      RATE_LIMIT_REDIS_FAILURE_POLICY: ${SCALED_RATE_LIMIT_REDIS_FAILURE_POLICY:-local-fallback}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mock-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s
    networks:
      - gateway-network

  api-gateway-scaled-b:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: api-gateway:latest
    env_file:
      - .env
    environment:
      BACKEND_BASE_URL: http://mock-backend:8081
      BACKEND_CONNECT_TIMEOUT_MS: ${BACKEND_CONNECT_TIMEOUT_MS:-500}
      BACKEND_READ_TIMEOUT_MS: ${BACKEND_READ_TIMEOUT_MS:-2000}
      BACKEND_MAX_ATTEMPTS: ${BACKEND_MAX_ATTEMPTS:-1}
      BACKEND_RETRY_BACKOFF_MS: ${BACKEND_RETRY_BACKOFF_MS:-50}
      BACKEND_CIRCUIT_BREAKER_ENABLED: ${BACKEND_CIRCUIT_BREAKER_ENABLED:-true}
      BACKEND_CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${BACKEND_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      BACKEND_CIRCUIT_BREAKER_RESET_TIMEOUT_MS: ${BACKEND_CIRCUIT_BREAKER_RESET_TIMEOUT_MS:-5000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT_STRATEGY: ${SCALED_RATE_LIMIT_STRATEGY:-redis-sliding-window}
      RATE_LIMIT_REDIS_FAILURE_POLICY: ${SCALED_RATE_LIMIT_REDIS_FAILURE_POLICY:-local-fallback}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mock-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s
    networks:
      - gateway-network

  gateway-lb:
    image: nginx:1.27-alpine
    ports:
      - "8100:80"
    volumes:
      - ./nginx/gateway-scaled.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-gateway-scaled-a:
        condition: service_healthy
      api-gateway-scaled-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - gateway-network

networks:
  gateway-network:
    driver: bridge
