server.port=${GATEWAY_PORT:8080}
backend.base-url=${BACKEND_BASE_URL:http://localhost:8081}
backend.connect-timeout-ms=${BACKEND_CONNECT_TIMEOUT_MS:500}
backend.read-timeout-ms=${BACKEND_READ_TIMEOUT_MS:2000}
backend.max-attempts=${BACKEND_MAX_ATTEMPTS:1}
backend.retry-backoff-ms=${BACKEND_RETRY_BACKOFF_MS:50}
backend.circuit-breaker-enabled=${BACKEND_CIRCUIT_BREAKER_ENABLED:true}
backend.circuit-breaker-failure-threshold=${BACKEND_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
backend.circuit-breaker-reset-timeout-ms=${BACKEND_CIRCUIT_BREAKER_RESET_TIMEOUT_MS:5000}

rate.limit.strategy=${RATE_LIMIT_STRATEGY:redis-sliding-window}
rate.limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:60}
rate.limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
rate.limit.redis-failure-policy=${RATE_LIMIT_REDIS_FAILURE_POLICY:fail-closed}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:${REDIS_TOKEN:}}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=api-gateway
info.app.role=distributed-rate-limited-proxy
