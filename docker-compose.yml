x-gateway-env: &gateway-env
  BACKEND_BASE_URL: http://mock-backend:8081
  REDIS_HOST: redis
  REDIS_PORT: 6379
  RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  RATE_LIMIT_REDIS_FAILURE_POLICY: ${RATE_LIMIT_REDIS_FAILURE_POLICY:-fail-closed}

x-gateway-common: &gateway-common
  build:
    context: ./api-gateway
    dockerfile: Dockerfile
  image: api-gateway:latest
  env_file:
    - .env
  restart: unless-stopped
  depends_on:
    - redis
    - mock-backend
  networks:
    - gateway-network

services:
  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - gateway-network

  mock-backend:
    build:
      context: ./mock-backend-service/mock-backend-service
      dockerfile: Dockerfile
    image: mock-backend-service:latest
    env_file:
      - .env
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - gateway-network

  api-gateway-redis-sliding-window:
    <<: *gateway-common
    environment:
      <<: *gateway-env
      RATE_LIMIT_STRATEGY: redis-sliding-window
    ports:
      - "8080:8080"

  api-gateway-redis-fixed-window:
    <<: *gateway-common
    environment:
      <<: *gateway-env
      RATE_LIMIT_STRATEGY: redis-fixed-window
    ports:
      - "8082:8080"

  api-gateway-redis-token-bucket:
    <<: *gateway-common
    environment:
      <<: *gateway-env
      RATE_LIMIT_STRATEGY: redis-token-bucket
    ports:
      - "8083:8080"

  api-gateway-in-memory:
    <<: *gateway-common
    environment:
      <<: *gateway-env
      RATE_LIMIT_STRATEGY: in-memory
    ports:
      - "8084:8080"

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8085:8081"
    depends_on:
      - redis
    networks:
      - gateway-network

networks:
  gateway-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
