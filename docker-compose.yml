x-gateway-env: &gateway-env
  BACKEND_BASE_URL: http://mock-backend:8081
  BACKEND_CONNECT_TIMEOUT_MS: ${BACKEND_CONNECT_TIMEOUT_MS:-500}
  BACKEND_READ_TIMEOUT_MS: ${BACKEND_READ_TIMEOUT_MS:-2000}
  BACKEND_MAX_ATTEMPTS: ${BACKEND_MAX_ATTEMPTS:-1}
  BACKEND_RETRY_BACKOFF_MS: ${BACKEND_RETRY_BACKOFF_MS:-50}
  BACKEND_CIRCUIT_BREAKER_ENABLED: ${BACKEND_CIRCUIT_BREAKER_ENABLED:-true}
  BACKEND_CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${BACKEND_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
  BACKEND_CIRCUIT_BREAKER_RESET_TIMEOUT_MS: ${BACKEND_CIRCUIT_BREAKER_RESET_TIMEOUT_MS:-5000}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  POSTGRES_DB: ${POSTGRES_DB:-gateshield}
  POSTGRES_USER: ${POSTGRES_USER:-gateshield}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateshield}
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gateshield}
  GATESHIELD_ADMIN_TOKEN: ${GATESHIELD_ADMIN_TOKEN:-change-me}
  RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  GATESHIELD_CORS_ALLOWED_ORIGINS: ${GATESHIELD_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}

# Base gateway service definition – shared by all strategy variants
x-gateway-common: &gateway-common
  build:
    context: ./api-gateway
    dockerfile: Dockerfile
  image: api-gateway:latest
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
    mock-backend:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/liveness || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 120s
  networks:
    - gateway-network

services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - gateway-network

  postgres:
    image: postgres:16-alpine
    container_name: gateshield-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gateshield}
      POSTGRES_USER: ${POSTGRES_USER:-gateshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateshield}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateshield} -d ${POSTGRES_DB:-gateshield}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - gateway-network

  mock-backend:
    build:
      context: ./mock-backend
      dockerfile: Dockerfile
    image: mock-backend-service:latest
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - gateway-network

  # Redis Commander – GUI for inspecting rate-limit keys
  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles: ["tools"]
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8085:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gateway-network

  # ---------------------------------------------------------------------------
  # Strategy matrix – primary strategies (fail-closed is the default policy)
  # ---------------------------------------------------------------------------

  gateshield:
    <<: *gateway-common
    container_name: gateshield-gateway
    environment:
      <<: *gateway-env
      RATE_LIMIT_STRATEGY: redis-sliding-window
      RATE_LIMIT_REDIS_FAILURE_POLICY: fail-closed
    ports:
      - "8080:8080"

  gateshield-console:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gateshield-console:latest
    restart: unless-stopped
    depends_on:
      gateshield:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - gateway-network

  api-gateway-redis-fixed-window:
    <<: *gateway-common
    container_name: gw-fixed-window
    profiles: ["experiments"]
    environment:
      <<: *gateway-env
      RATE_LIMIT_STRATEGY: redis-fixed-window
      RATE_LIMIT_REDIS_FAILURE_POLICY: fail-closed
    ports:
      - "8082:8080"

  api-gateway-redis-token-bucket:
    <<: *gateway-common
    container_name: gw-token-bucket
    profiles: ["experiments"]
    environment:
      <<: *gateway-env
      RATE_LIMIT_STRATEGY: redis-token-bucket
      RATE_LIMIT_REDIS_FAILURE_POLICY: fail-closed
    ports:
      - "8083:8080"

  api-gateway-in-memory:
    <<: *gateway-common
    container_name: gw-in-memory
    profiles: ["experiments"]
    environment:
      <<: *gateway-env
      RATE_LIMIT_STRATEGY: in-memory
      # in-memory never touches Redis, so failure policy is irrelevant
      RATE_LIMIT_REDIS_FAILURE_POLICY: fail-closed
    ports:
      - "8084:8080"

  # ---------------------------------------------------------------------------
  # Fault-tolerance policy matrix – expose each policy on a dedicated port so
  # run_latency_experiments.py can target them independently.
  #
  # Naming convention:  gw-{strategy}-{policy}
  # Port convention:    8090-8099 reserved for fault-tolerance experiment ports
  # ---------------------------------------------------------------------------

  # redis-fixed-window × fail-open  (port 8090)
  api-gateway-fixed-window-fail-open:
    <<: *gateway-common
    container_name: gw-fixed-window-fail-open
    profiles: ["experiments"]
    environment:
      <<: *gateway-env
      RATE_LIMIT_STRATEGY: redis-fixed-window
      RATE_LIMIT_REDIS_FAILURE_POLICY: fail-open
    ports:
      - "8090:8080"

  # redis-fixed-window × local-fallback  (port 8091)
  api-gateway-fixed-window-local-fallback:
    <<: *gateway-common
    container_name: gw-fixed-window-local-fallback
    profiles: ["experiments"]
    environment:
      <<: *gateway-env
      RATE_LIMIT_STRATEGY: redis-fixed-window
      RATE_LIMIT_REDIS_FAILURE_POLICY: local-fallback
    ports:
      - "8091:8080"

  # redis-token-bucket × fail-open  (port 8092)
  api-gateway-token-bucket-fail-open:
    <<: *gateway-common
    container_name: gw-token-bucket-fail-open
    profiles: ["experiments"]
    environment:
      <<: *gateway-env
      RATE_LIMIT_STRATEGY: redis-token-bucket
      RATE_LIMIT_REDIS_FAILURE_POLICY: fail-open
    ports:
      - "8092:8080"

  # redis-token-bucket × local-fallback  (port 8093)
  api-gateway-token-bucket-local-fallback:
    <<: *gateway-common
    container_name: gw-token-bucket-local-fallback
    profiles: ["experiments"]
    environment:
      <<: *gateway-env
      RATE_LIMIT_STRATEGY: redis-token-bucket
      RATE_LIMIT_REDIS_FAILURE_POLICY: local-fallback
    ports:
      - "8093:8080"

  # redis-sliding-window × fail-open  (port 8094)
  api-gateway-sliding-window-fail-open:
    <<: *gateway-common
    container_name: gw-sliding-window-fail-open
    profiles: ["experiments"]
    environment:
      <<: *gateway-env
      RATE_LIMIT_STRATEGY: redis-sliding-window
      RATE_LIMIT_REDIS_FAILURE_POLICY: fail-open
    ports:
      - "8094:8080"

  # redis-sliding-window × local-fallback  (port 8095)
  api-gateway-sliding-window-local-fallback:
    <<: *gateway-common
    container_name: gw-sliding-window-local-fallback
    profiles: ["experiments"]
    environment:
      <<: *gateway-env
      RATE_LIMIT_STRATEGY: redis-sliding-window
      RATE_LIMIT_REDIS_FAILURE_POLICY: local-fallback
    ports:
      - "8095:8080"

  # ---------------------------------------------------------------------------
  # Scaled deployment profile - two gateway replicas behind Nginx on port 8100
  # ---------------------------------------------------------------------------

  api-gateway-scaled-a:
    <<: *gateway-common
    container_name: gateshield-scaled-a
    profiles: ["scaled"]
    environment:
      <<: *gateway-env
      RATE_LIMIT_STRATEGY: ${SCALED_RATE_LIMIT_STRATEGY:-redis-sliding-window}
      RATE_LIMIT_REDIS_FAILURE_POLICY: ${SCALED_RATE_LIMIT_REDIS_FAILURE_POLICY:-local-fallback}

  api-gateway-scaled-b:
    <<: *gateway-common
    container_name: gateshield-scaled-b
    profiles: ["scaled"]
    environment:
      <<: *gateway-env
      RATE_LIMIT_STRATEGY: ${SCALED_RATE_LIMIT_STRATEGY:-redis-sliding-window}
      RATE_LIMIT_REDIS_FAILURE_POLICY: ${SCALED_RATE_LIMIT_REDIS_FAILURE_POLICY:-local-fallback}

  gateway-lb:
    image: nginx:1.27-alpine
    profiles: ["scaled"]
    ports:
      - "8100:80"
    volumes:
      - ./nginx/gateway-scaled.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-gateway-scaled-a:
        condition: service_healthy
      api-gateway-scaled-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - gateway-network

networks:
  gateway-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
