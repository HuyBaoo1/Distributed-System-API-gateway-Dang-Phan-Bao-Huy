upstream gateway_scaled {
    server api-gateway-scaled-a:8080 max_fails=2 fail_timeout=5s;
    server api-gateway-scaled-b:8080 max_fails=2 fail_timeout=5s;
    server api-gateway-scaled-c:8080 max_fails=2 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://gateway_scaled;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 1s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }
}
